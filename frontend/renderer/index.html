<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Form Renderer — Standalone Harness</title>
  <link rel="stylesheet" href="renderer.css" />
</head>
<body>
  <!--
    This page is a standalone harness for form-renderer.js, independent of the
    application shell in frontend/app/. It proves the renderer works as a
    reusable component with any consumer: this harness is a second, separate
    caller of window.FormRenderer.mount(), alongside frontend/app/mainArea.js.

    form-renderer.js itself contains no fetch/boot logic and does not know
    which form is being rendered — this harness page fetches the definition
    and passes it in, exactly like the app shell does.

    Usage: open with ?def=path/to/some.definition.json to preview any
    definition file (resolved relative to this page). Defaults to the Form 3
    reference implementation.
  -->
  <header id="topbar">
    <strong>Form Renderer — standalone harness</strong>
    <span id="def-path"></span>
    <span class="spacer"></span>
    <span class="hint">window.FormRenderer.mount() called directly by this page's own script &mdash; not by the app shell.</span>
  </header>

  <div id="mount">Loading definition&hellip;</div>

  <script src="form-renderer.js"></script>
  <script>
    (function () {
      // Resolved relative to this page (frontend/renderer/ → ../../docs/…),
      // not root-absolute: a leading "/" resolves to the drive root under
      // file://, which points outside the project.
      var defPath = new URL(
        new URLSearchParams(location.search).get("def") ||
          "../../docs/specifications/definitions/form_03.definition.json",
        document.baseURI
      ).href;
      document.getElementById("def-path").textContent = defPath;

      fetch(defPath)
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (definition) {
          window.FormRenderer.mount(document.getElementById("mount"), definition, {}, {
            onChange: function (values) { console.log("[harness] values changed:", values); },
            onGapsChange: function (gaps, findings) {
              if (gaps.length) console.warn("[harness] gaps:", gaps);
              if (findings.length) console.info("[harness] findings:", findings);
            }
          });
        })
        .catch(function (e) {
          document.getElementById("mount").textContent = "Failed to load definition (" + defPath + "): " + e.message;
        });
    })();
  </script>
</body>
</html>
